name: Setup Environment
description: Setup the Java environment to check and build the Pudans backend.

inputs:
  java-version:
    description: Java version.
    required: false
    default: "25"

runs:
  using: "composite"
  steps:
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        cache: "gradle"
        java-version: ${{ inputs.java-version }}
