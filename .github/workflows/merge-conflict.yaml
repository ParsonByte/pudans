name: Merge Conflict Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: merge-conflict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Merge conflict check
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for conflicts with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-head"
          if ! output=$(git merge-tree --write-tree --name-only origin/pr-head "origin/$BASE_REF" 2>&1); then
            echo "::error::This branch has merge conflicts with $BASE_REF."
            printf '%s\n' "$output"
            exit 1
          fi
          echo "No merge conflicts with $BASE_REF."