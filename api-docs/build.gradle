plugins {
    id 'base'
}

description = 'OpenAPI documentation aggregation and validation only. No business code, no runtime dependency.'

def docsDir = layout.projectDirectory.dir('openapi/v3_0')
def requiredFiles = ['apis_api_v1alpha1.json']
def forbiddenSchemas = ~/(?i)^(Post|SinglePage|Category|Tag|Comment|Attachment|AttachmentGroup|AttachmentPolicy|Storage|StoragePolicy|Policy|PolicyTemplate|Menu|MenuItem|Theme|Snapshot|Counter|Backup)/
def forbiddenPathSegments = ['/posts', '/singlepages', '/categories', '/tags', '/comments', '/attachments', '/storage', '/menus', '/themes', '/snapshots']
def apiPrefix = '/apis/api.pudans.tolim.cn/v1alpha1/'

tasks.register('validateOpenApiDocs') {
    group = 'verification'
    description = 'Validate the merged OpenAPI JSON document.'
    inputs.dir docsDir
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def parsed = [:]
        requiredFiles.each { name ->
            def file = docsDir.file(name).asFile
            assert file.exists(): "Missing OpenAPI document: ${name}"
            parsed[name] = slurper.parse(file)
        }

        def yamlFiles = fileTree(projectDir) { include '**/*.yaml', '**/*.yml' }.files
        assert yamlFiles.isEmpty(): "api-docs must not contain YAML files: ${yamlFiles}"

        parsed.each { name, doc ->
            assert doc.openapi?.startsWith('3.0'): "Unsupported OpenAPI version in ${name}"
            def schemas = doc.components?.schemas ?: [:]
            def badSchemas = schemas.keySet().findAll { it ==~ forbiddenSchemas }
            assert badSchemas.isEmpty(): "Forbidden schemas in ${name}: ${badSchemas}"
            def paths = doc.paths.keySet()
            def badPaths = paths.findAll { path ->
                forbiddenPathSegments.any { segment -> path.toLowerCase().contains(segment) }
            }
            assert badPaths.isEmpty(): "Forbidden paths in ${name}: ${badPaths}"
            assert paths.every { it.startsWith(apiPrefix) }:
                    "Paths outside ${apiPrefix} in ${name}: ${paths.findAll { !it.startsWith(apiPrefix) }}"
            assert !paths.any { it.contains('/apis/{group}/{version}/') }:
                    "Placeholder API group/version paths in ${name}: ${paths.findAll { it.contains('/apis/{group}/{version}/') }}"
            def invalidVersions = paths.findAll { path ->
                def parts = path.split('/')
                !(parts[3] ==~ /^v[0-9]+(?:(?:alpha|beta)[0-9]+)?$/)
            }
            assert invalidVersions.isEmpty(): "API paths without a valid version in ${name}: ${invalidVersions}"
            def operationTags = doc.paths.values().collectMany { operations ->
                operations.values()
                        .findAll { operation -> operation instanceof Map }
                        .collectMany { operation -> operation.tags ?: [] }
            } as Set
            def invalidTags = operationTags.findAll { tag -> !(tag ==~ /^[A-Za-z0-9]+V1alpha1$/) }
            assert invalidTags.isEmpty(): "API tags must use the <Kind>V1alpha1 form in ${name}: ${invalidTags}"
        }

        def paths = parsed['apis_api_v1alpha1.json'].paths.keySet()
        def userSpec = parsed['apis_api_v1alpha1.json'].components.schemas.UserSpec
        assert userSpec != null: 'UserSpec schema is required'
        assert userSpec.properties.displayName.readOnly == true: 'UserSpec.displayName must be readOnly'
        assert userSpec.properties.email.readOnly == true: 'UserSpec.email must be readOnly'

        assert paths.any { it.endsWith('/users/-/batch') }: 'API must expose batch user creation'
        assert paths.any { it.endsWith('/users/-/self') }: 'API must expose the current user self endpoint'
        assert paths.any { it.endsWith('/users/-/self/permissions') }: 'API must expose self permissions'
        assert paths.any { it.endsWith('/users/-/self/password') }: 'API must expose self password change'
        assert paths.any { it.endsWith('/auditlogs') }: 'API must expose audit log query'
        assert paths.any { it.endsWith('/auditlogs/graph') }: 'API must expose the daily audit graph'
        assert paths.any { it.endsWith('/trace') }: 'API must expose audit trace lookup'
        assert paths.any { it.contains('/auditlogs/replay/') }: 'API must expose read-only audit replay'
        assert paths.any { it.endsWith('/usergroups') }: 'API must expose user groups'
        assert paths.any { it.endsWith('/usergroupbindings') }: 'API must expose user group bindings'
        assert paths.any { it.endsWith('/temprolebindings') }: 'API must expose JIT temp role bindings'
        assert paths.any { it.endsWith('/webhooks') }: 'API must expose webhooks'
        assert paths.any { it.endsWith('/riskrules') }: 'API must expose risk rules'
        assert paths.any { it.contains('/user-preferences/') }: 'API must expose user preferences'
        assert paths.any { it.endsWith('/annotationsettings') }: 'API must expose annotation settings'
        assert paths.any { it.contains('/system/setup') }: 'API must expose system setup'
        assert paths.any { it.contains('/auth-providers') }: 'API must expose auth providers'
        assert paths.any { it.contains('/passkeys/assertion/options') }: 'API must expose passkey assertion'
        assert paths.any { it.contains('/passkeys/registration/options') }: 'API must expose passkey registration'
        assert paths.any { it.contains('/userconnections/oidc/bind') }: 'API must expose OIDC binding'
        assert paths.any { it.endsWith('/personalaccesstokens') }: 'API must expose personal access tokens'
        assert paths.any { it.contains('/authentications/two-factor/settings') }: 'API must expose two-factor settings'
        assert paths.any { it.contains('feishu') }: 'API must expose Feishu OAuth2 endpoints'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('validateOpenApiDocs')
}
tasks.named('check') {
    dependsOn tasks.named('validateOpenApiDocs')
}
