plugins {
    id 'java-library'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
}

group = 'cn.tolim.pudans'
description = 'pudans appkernel: enterprise identity and permission management backend.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.configureEach {
    // 华为 OBS SDK 会传递引入 Kotlin 多平台的 okhttp-jvm，与 UpYun 依赖的 OkHttp 4 线冲突。
    exclude group: 'com.squareup.okhttp3', module: 'okhttp-jvm'
}

dependencies {

    add('implementation', platform(project(':platform:appkernel')))
    add('annotationProcessor', platform(project(':platform:appkernel')))

    def sharedDeps = [
        'org.jspecify:jspecify',
        'org.springframework.boot:spring-boot-starter-actuator',
        'org.springframework.boot:spring-boot-starter-mail',
        'org.springframework.boot:spring-boot-starter-webflux',
        'org.springframework.boot:spring-boot-starter-validation',
        'org.springframework.boot:spring-boot-starter-data-r2dbc',
        libs.spring.boot.starter.data.redis.reactive,
        libs.spring.session.data.redis,
        libs.commons.pool2,
        'org.springframework.boot:spring-boot-jackson2',
        'org.springframework.boot:spring-boot-session',
        'org.springframework.boot:spring-boot-starter-security',
        'org.springframework.security:spring-security-oauth2-jose',
        'org.springframework.security:spring-security-oauth2-client',
        'org.springframework.security:spring-security-oauth2-resource-server',
        'org.springframework.boot:spring-boot-starter-cache',
        libs.springdoc.openapi,
        libs.openapi.schema.validator,
        'net.bytebuddy:byte-buddy',
        libs.apache.commons.lang3,
        libs.apache.commons.io,
        libs.langchain4j,
        libs.langchain4j.open.ai,
        libs.langchain4j.anthropic,
        libs.langchain4j.mcp,
        libs.langchain4j.community.dashscope,
        libs.webauthn4j,
        libs.guava,
        libs.json.patch,
        libs.resilience4j.springboot3,
        libs.resilience4j.reactor,
        libs.twofactor.auth,
        libs.ua.parser,
        libs.therapi.runtime.javadoc,
        libs.java.semver,
        libs.bouncycastle.bcprov,
        libs.okhttp,
        libs.aws.sdk.s3,
        libs.aws.sdk.netty.nio.client,
        libs.aliyun.oss,
        libs.tencent.cos,
        libs.qiniu.java.sdk,
        libs.upyun.java.sdk,
        libs.huawei.obs,
    ]
    // 直播录制流复制，仅在录制线程使用，不进入请求路径
    implementation(libs.javacv) {
        exclude group: 'org.bytedeco', module: 'openblas'
        exclude group: 'org.bytedeco', module: 'opencv'
        exclude group: 'org.bytedeco', module: 'flycapture'
        exclude group: 'org.bytedeco', module: 'libdc1394'
        exclude group: 'org.bytedeco', module: 'libfreenect'
        exclude group: 'org.bytedeco', module: 'libfreenect2'
        exclude group: 'org.bytedeco', module: 'librealsense'
        exclude group: 'org.bytedeco', module: 'librealsense2'
        exclude group: 'org.bytedeco', module: 'videoinput'
        exclude group: 'org.bytedeco', module: 'artoolkitplus'
    }
    add('implementation', "org.bytedeco:javacpp:${libs.versions.javacv.get()}:linux-x86_64")
    add('implementation', "org.bytedeco:javacpp:${libs.versions.javacv.get()}:windows-x86_64")
    add('implementation', "org.bytedeco:ffmpeg:${libs.versions.ffmpeg.get()}:linux-x86_64")
    add('implementation', "org.bytedeco:ffmpeg:${libs.versions.ffmpeg.get()}:windows-x86_64")
    sharedDeps.each { d ->
        add('implementation', d)
    }
    add('annotationProcessor', libs.therapi.runtime.javadoc.scribe)
    add('compileOnly', 'org.projectlombok:lombok')
    add('annotationProcessor', 'org.projectlombok:lombok')
    add('annotationProcessor', 'org.springframework.boot:spring-boot-configuration-processor')
    add('annotationProcessor', 'org.springframework:spring-context-indexer')

    implementation(libs.larksuite.oapi)
    add('testImplementation', platform(project(':platform:appkernel')))
    add('testImplementation', 'org.springframework.boot:spring-boot-starter-test')
    add('testImplementation', libs.jsonassert)
    add('testImplementation', 'io.projectreactor:reactor-test')
    add('testRuntimeOnly', 'org.junit.platform:junit-platform-launcher')
    add('runtimeOnly', 'org.postgresql:r2dbc-postgresql')
    add('runtimeOnly', 'io.r2dbc:r2dbc-pool')
}

springBoot {
    buildInfo {
        properties {
            artifact = 'pudans'
            name = 'pudans'
        }
    }
}

bootJar {
    archiveBaseName = 'pudans'
    mainClass = 'cn.tolim.pudans.Application'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Implementation-Title': 'pudans Application',
            'Implementation-Vendor': 'pudans'
    }
}

tasks.register('stageDistribution', Sync) {
    description = 'Copy the runnable backend jar into the root build directory.'
    dependsOn tasks.named('bootJar')
    from(tasks.named('bootJar').flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.dir('appkernel'))
}

tasks.named('assemble') {
    dependsOn tasks.named('stageDistribution')
}

tasks.named('jar') {
    archiveBaseName = 'pudans-appkernel'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = false
    }
}
