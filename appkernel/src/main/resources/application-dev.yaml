server:
  port: 8090

spring:
  output:
    ansi:
      enabled: always

pudans:
  security:
    basic-auth:
      disabled: false
    password-reset:
      log-codes: true
  work-dir: ${user.home}/pudans2-dev

logging:
  level:
    org.springframework.data.r2dbc: DEBUG
    org.springframework.r2dbc: DEBUG
    cn.tolim.pudans: DEBUG
    org.springframework.boot.autoconfigure.web.reactive.error.AbstractErrorWebExceptionHandler: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
