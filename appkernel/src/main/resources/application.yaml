server:
  port: 8090
  forward-headers-strategy: native
  compression:
    enabled: true

spring:
  output:
    ansi:
      enabled: detect
  jackson:
    time-zone: Asia/Shanghai
  r2dbc:
    url: ${PUDANS_DB_URL:r2dbc:postgresql://localhost:5432/pudans}
    username: ${PUDANS_DB_USERNAME:pudans}
    password: ${PUDANS_DB_PASSWORD:pudans}
    pool:
      enabled: true
      initial-size: 1
      max-size: 20
      max-idle-time: 30m
  sql:
    init:
      mode: always
      platform: postgresql
      separator: "@"
      schema-locations: classpath:schema-postgresql.sql
  data:
    redis:
      host: ${PUDANS_REDIS_HOST:localhost}
      port: ${PUDANS_REDIS_PORT:6379}
      password: ${PUDANS_REDIS_PASSWORD:}
      database: ${PUDANS_REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 5s
  session:
    store-type: redis
    timeout: 30m
  cache:
    type: redis
  webflux:
    multipart:
      max-in-memory-size: 256KB
      max-disk-usage-per-part: 100MB
  http:
    codecs:
      max-in-memory-size: 10MB
  web:
    error:
      whitelabel:
        enabled: false
  threads:
    virtual:
      enabled: true


pudans:
  work-dir: ${PUDANS_WORK_DIR:${user.home}/.pudans}
  memory:
    reme:
      enabled: ${REME_MEMORY_ENABLED:false}
      api-base-url: ${REME_MEMORY_API_BASE_URL:}
      timeout: ${REME_MEMORY_TIMEOUT:60s}
      top-k: ${REME_MEMORY_TOP_K:5}
      max-context-chars: ${REME_MEMORY_MAX_CONTEXT_CHARS:8000}
      workspace-prefix: ${REME_MEMORY_WORKSPACE_PREFIX:pudans}
  ai:
    credential-key-file: keys/ai-channel.key
    connect-timeout: 5s
    response-timeout: 20s
    reservation-ttl: 15m
    default-timeout-ms: 30000
  sandbox:
    enabled: ${PUDANS_SANDBOX_ENABLED:${AGENTRUN_SANDBOX_ENABLED:false}}
    provider: ${PUDANS_SANDBOX_PROVIDER:${AGENTRUN_SANDBOX_PROVIDER:agentrun}}
    api-key: ${AGENTRUN_SANDBOX_API_KEY:}
    account-id: ${AGENTRUN_SANDBOX_ACCOUNT_ID:}
    region: ${AGENTRUN_SANDBOX_REGION:}
    data-plane-base-url: ${AGENTRUN_SANDBOX_DATA_PLANE_BASE_URL:}
    template: ${AGENTRUN_SANDBOX_TEMPLATE:}
    mcp-server-url: ${AGENTRUN_SANDBOX_MCP_SERVER_URL:}
    workspace-root: ${AGENTRUN_SANDBOX_WORKSPACE_ROOT:/home/pudans/workspace}
    default-ttl: ${AGENTRUN_SANDBOX_DEFAULT_TTL:30m}
    max-ttl-seconds: ${AGENTRUN_SANDBOX_MAX_TTL_SECONDS:86400}
    lease-ttl: ${AGENTRUN_SANDBOX_LEASE_TTL:10m}
    default-exec-timeout-seconds: ${AGENTRUN_SANDBOX_EXEC_TIMEOUT_SECONDS:120}
    max-output-bytes: ${AGENTRUN_SANDBOX_MAX_OUTPUT_BYTES:65536}
    max-file-bytes: ${AGENTRUN_SANDBOX_MAX_FILE_BYTES:524288}
    connect-timeout-seconds: ${AGENTRUN_SANDBOX_CONNECT_TIMEOUT_SECONDS:30}
    read-timeout-seconds: ${AGENTRUN_SANDBOX_READ_TIMEOUT_SECONDS:120}
    max-retries: ${AGENTRUN_SANDBOX_MAX_RETRIES:3}
    snapshot-ttl: ${AGENTRUN_SANDBOX_SNAPSHOT_TTL:7d}
    e2b:
      api-key: ${E2B_SANDBOX_API_KEY:}
      api-base-url: ${E2B_SANDBOX_API_BASE_URL:https://api.e2b.app}
      domain: ${E2B_SANDBOX_DOMAIN:e2b.app}
      template: ${E2B_SANDBOX_TEMPLATE:base}
      workspace-root: ${E2B_SANDBOX_WORKSPACE_ROOT:/home/user}
      run-user: ${E2B_SANDBOX_RUN_USER:user}
      persistence-mode: ${E2B_SANDBOX_PERSISTENCE_MODE:TAR}
  live:
    resolve:
      connect-timeout: 5s
      response-timeout: 10s
      max-html-bytes: 8MB
      cache-ttl: 45s
      offline-cache-ttl: 20s
      lock-ttl: 15s
      lock-wait: 2s
      cooldown: 10m
      max-cooldown: 1h
      cookie: ${PUDANS_LIVE_DOUYIN_COOKIE:}
    monitor:
      tick: 5s
      default-interval: 60s
      live-interval: 30s
      max-per-tick: 20
      resolve-concurrency: 4
      failure-backoff: 1m
      max-failure-backoff: 15m
      error-threshold: 3
      leader-ttl: 15s
    recorder:
      max-concurrent: 2
      queue-capacity: 10
      work-dir: ${pudans.work-dir}/live-recordings
      segment-seconds: 30
      merge:
        max-local-bytes: 6GB
        max-local-segments: 360
        max-pending-parts: 2
      max-duration: 6h
      read-timeout: 15s
      stream-idle-timeout: 30s
      max-retries: 5
      retry-backoff: 1s
      max-retry-backoff: 30s
      retry-jitter: 0.2
      upload-retries: 3
      finalize-timeout: 5m
      min-free-disk-bytes: 8GB
      stop-timeout: 30s
      recovery-lock-ttl: 10m
    retention:
      days: ${PUDANS_LIVE_RETENTION_DAYS:7}
      interval: 1h
      batch-size: 100
    alert:
      dedupe: 10m
      stream-interrupt-threshold: 60s
      rate-limit-threshold: 3
  storage:
    cleanup-interval-seconds: ${PUDANS_STORAGE_CLEANUP_INTERVAL:300}
  webhook:
    keystore-password: ${PUDANS_WEBHOOK_KEYSTORE_PASSWORD:}
  security:
    post-login-url: ${PUDANS_POST_LOGIN_URL:/}
    basic-auth:
      disabled: true
    two-factor-auth:
      disabled: false
    totp:
      key: ${PUDANS_TOTP_KEY:}
      keystore-password: ${PUDANS_TOTP_KEYSTORE_PASSWORD:}
    trusted-proxies: ${PUDANS_TRUSTED_PROXIES:127.0.0.1,::1}
  feishu:
    enabled: ${FEISHU_ENABLED:false}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:{baseUrl}/apis/api.pudans.tolim.cn/v1alpha1/oauth2/callback/feishu}
    sync-interval-seconds: ${FEISHU_SYNC_INTERVAL:21600}
    alert-chat-id: ${FEISHU_ALERT_CHAT_ID:}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    archive-interval-seconds: ${AUDIT_ARCHIVE_INTERVAL:21600}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: pudans
    origins: ${WEBAUTHN_ORIGINS:http://localhost:8090}
  oidc:
    providers: []

springdoc:
  api-docs:
    enabled: false
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
  file:
    name: ${pudans.work-dir}/logs/pudans.log

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized


