server:
  port: 8090
  forward-headers-strategy: native
  compression:
    enabled: true

spring:
  output:
    ansi:
      enabled: detect
  jackson:
    time-zone: Asia/Shanghai
  r2dbc:
    url: ${PUDANS_DB_URL:r2dbc:postgresql://localhost:5432/pudans}
    username: ${PUDANS_DB_USERNAME:pudans}
    password: ${PUDANS_DB_PASSWORD:pudans}
    pool:
      enabled: true
      initial-size: 1
      max-size: 20
      max-idle-time: 30m
  sql:
    init:
      mode: always
      platform: postgresql
      separator: "@"
      schema-locations: classpath:schema-postgresql.sql
  data:
    redis:
      host: ${PUDANS_REDIS_HOST:localhost}
      port: ${PUDANS_REDIS_PORT:6379}
      password: ${PUDANS_REDIS_PASSWORD:}
      database: ${PUDANS_REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 5s
  session:
    store-type: redis
    timeout: 30m
  cache:
    type: redis
  http:
    codecs:
      max-in-memory-size: 10MB
  web:
    error:
      whitelabel:
        enabled: false
  threads:
    virtual:
      enabled: true


pudans:
  work-dir: ${PUDANS_WORK_DIR:${user.home}/.pudans}
  live:
    resolve:
      connect-timeout: 5s
      response-timeout: 10s
      max-html-bytes: 8MB
      cache-ttl: 45s
      offline-cache-ttl: 20s
      lock-ttl: 15s
      lock-wait: 2s
      cooldown: 10m
      max-cooldown: 1h
      cookie: ${PUDANS_LIVE_DOUYIN_COOKIE:}
    monitor:
      tick: 5s
      default-interval: 60s
      live-interval: 30s
      max-per-tick: 20
      resolve-concurrency: 4
      failure-backoff: 1m
      max-failure-backoff: 15m
      error-threshold: 3
      leader-ttl: 15s
    recorder:
      max-concurrent: 2
      queue-capacity: 10
      work-dir: ${pudans.work-dir}/live-recordings
      segment-seconds: 30
      merge:
        max-local-bytes: 6GB
        max-local-segments: 360
        max-pending-parts: 2
      max-duration: 6h
      read-timeout: 15s
      stream-idle-timeout: 30s
      max-retries: 5
      retry-backoff: 1s
      max-retry-backoff: 30s
      retry-jitter: 0.2
      upload-retries: 3
      finalize-timeout: 5m
      min-free-disk-bytes: 8GB
      stop-timeout: 30s
      recovery-lock-ttl: 10m
    retention:
      days: ${PUDANS_LIVE_RETENTION_DAYS:7}
      interval: 1h
      batch-size: 100
    alert:
      dedupe: 10m
      rate-limit-threshold: 3
  storage:
    cleanup-interval-seconds: ${PUDANS_STORAGE_CLEANUP_INTERVAL:300}
  webhook:
    keystore-password: ${PUDANS_WEBHOOK_KEYSTORE_PASSWORD:}
  security:
    post-login-url: ${PUDANS_POST_LOGIN_URL:/}
    basic-auth:
      disabled: true
    two-factor-auth:
      disabled: false
    totp:
      key: ${PUDANS_TOTP_KEY:}
      keystore-password: ${PUDANS_TOTP_KEYSTORE_PASSWORD:}
    trusted-proxies: ${PUDANS_TRUSTED_PROXIES:127.0.0.1,::1}
  feishu:
    enabled: ${FEISHU_ENABLED:false}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:{baseUrl}/apis/api.pudans.tolim.cn/v1alpha1/oauth2/callback/feishu}
    sync-interval-seconds: ${FEISHU_SYNC_INTERVAL:21600}
    alert-chat-id: ${FEISHU_ALERT_CHAT_ID:}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    archive-interval-seconds: ${AUDIT_ARCHIVE_INTERVAL:21600}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: pudans
    origins: ${WEBAUTHN_ORIGINS:http://localhost:8090}
  oidc:
    providers: []

springdoc:
  api-docs:
    enabled: false
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
  file:
    name: ${pudans.work-dir}/logs/pudans.log

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized


