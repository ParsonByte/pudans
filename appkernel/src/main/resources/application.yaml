server:
  port: 8090
  forward-headers-strategy: native
  compression:
    enabled: true

spring:
  output:
    ansi:
      enabled: detect
  jackson:
    time-zone: Asia/Shanghai
  r2dbc:
    url: ${PUDANS_DB_URL:r2dbc:postgresql://localhost:5432/pudans}
    username: ${PUDANS_DB_USERNAME:pudans}
    password: ${PUDANS_DB_PASSWORD:pudans}
    pool:
      enabled: true
      initial-size: 1
      max-size: 20
      max-idle-time: 30m
  sql:
    init:
      mode: always
      platform: postgresql
      separator: "@"
      schema-locations: classpath:schema-postgresql.sql
  data:
    redis:
      host: ${PUDANS_REDIS_HOST:localhost}
      port: ${PUDANS_REDIS_PORT:6379}
      password: ${PUDANS_REDIS_PASSWORD:}
      database: ${PUDANS_REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 5s
  session:
    store-type: redis
    timeout: 30m
  cache:
    type: redis
  http:
    codecs:
      max-in-memory-size: 10MB
  web:
    error:
      whitelabel:
        enabled: false
  threads:
    virtual:
      enabled: true


pudans:
  work-dir: ${PUDANS_WORK_DIR:${user.home}/.pudans}
  ai:
    enabled: ${PUDANS_AI_ENABLED:true}
    worker:
      poll-interval: 1s
      batch-size: 20
      max-concurrency: 4
      lock-ttl: 5m
    web-client:
      connect-timeout: 5s
      response-timeout: 300s
      max-in-memory-size: 16MB
    routing:
      health-threshold: 60
      circuit:
        failure-threshold: 5
        success-threshold: 3
        open-duration: 30s
        max-open-duration: 5m
        max-latency-millis: 60000
    gateway:
      enabled: true
      injection-enabled: true
    embedding:
      dimension: 1536
    runtime:
      gateway-url: ${PUDANS_GATEWAY_URL:http://127.0.0.1:8090/apis/api.pudans.tolim.cn/v1alpha1/aigateway}
      log-buffer-size: 500
      lock-seconds: 60
      request-timeout-seconds: 60
      log-poll-seconds: 2
      log-file: ${PUDANS_RUNTIME_LOG_FILE:/tmp/pudans-agent.log}
      tencent-data-plane-template: ${PUDANS_TENCENT_SANDBOX_DATA_PLANE:https://49983-%s.%s.tencentags.com}
      tencent-api-version: 2025-09-20
  storage:
    cleanup-interval-seconds: ${PUDANS_STORAGE_CLEANUP_INTERVAL:300}
  webhook:
    keystore-password: ${PUDANS_WEBHOOK_KEYSTORE_PASSWORD:}
  security:
    post-login-url: ${PUDANS_POST_LOGIN_URL:/}
    basic-auth:
      disabled: true
    two-factor-auth:
      disabled: false
    totp:
      key: ${PUDANS_TOTP_KEY:}
      keystore-password: ${PUDANS_TOTP_KEYSTORE_PASSWORD:}
    trusted-proxies: ${PUDANS_TRUSTED_PROXIES:127.0.0.1,::1}
  feishu:
    enabled: ${FEISHU_ENABLED:false}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:{baseUrl}/apis/api.pudans.tolim.cn/v1alpha1/oauth2/callback/feishu}
    sync-interval-seconds: ${FEISHU_SYNC_INTERVAL:21600}
    alert-chat-id: ${FEISHU_ALERT_CHAT_ID:}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    archive-interval-seconds: ${AUDIT_ARCHIVE_INTERVAL:21600}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: pudans
    origins: ${WEBAUTHN_ORIGINS:http://localhost:8090}
  oidc:
    providers: []

springdoc:
  api-docs:
    enabled: false
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
  file:
    name: ${pudans.work-dir}/logs/pudans.log

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized


