apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: super-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "超级管理员"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["*"]'
  finalizers:
    - system-protection
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    nonResourceURLs:
      - "*"
    verbs:
      - "*"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: system-admin-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "系统管理员"
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [
        "role-template-view-dashboard",
        "role-template-manage-settings",
        "role-template-manage-auth-providers",
        "role-template-manage-users",
        "role-template-manage-roles",
        "role-template-manage-usergroups",
        "role-template-manage-riskrules",
        "role-template-audit-logs",
        "role-template-view-traces",
        "role-template-export-traces",
        "role-template-archive-audit-logs",
        "role-template-view-replay",
        "role-template-manage-webhooks",
        "role-template-manage-actuator",
        "role-template-manage-cache",
        "role-template-manage-configmaps",
        "role-template-manage-storage-policies",
        "role-template-manage-storage-files",
        "role-template-apply-temproles",
        "role-template-approve-temproles",
        "role-template-view-temproles",
        "role-template-view-riskrules",
        "role-template-view-settings",
        "role-template-ai-admin",
        "role-template-update-ai-memory",
        "role-template-delete-ai-memory",
        "role-template-execute-ai-memory",
        "role-template-export-ai-memory",
        "role-template-create-ai-memory",
        "role-template-import-ai-memory",
        "role-template-allocate-ai-memory",
        "role-template-clear-ai-memory",
        "role-template-settings-ai-memory",
        "role-template-prompts-ai-memory",
        "role-template-logs-ai-memory",
        "role-template-delete-ai-sessions",
        "role-template-gateway-ai-sessions",
        "role-template-create-ai-agent-runtime",
        "role-template-update-ai-agent-runtime",
        "role-template-delete-ai-agent-runtime",
        "role-template-start-ai-agent-runtime",
        "role-template-stop-ai-agent-runtime",
        "role-template-restart-ai-agent-runtime",
        "role-template-exec-ai-agent-runtime",
        "role-template-files-ai-agent-runtime",
        "role-template-logs-ai-agent-runtime",
        "role-template-ai-gateway",
        "role-template-create-ai-gateway",
        "role-template-manage-ai-gateway",
        "role-template-settings-ai-gateway",
        "role-template-sessions-ai-gateway",
        "role-template-usage-overview-clear"
      ]
  finalizers:
    - system-protection
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "secrets"
      - "remembermetokens"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
      - "delete"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: normal-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "普通用户"
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "authenticated", "role-template-ai-user", "role-template-delete-ai-sessions" ]'
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["profile:manage","authentications:manage"]'
  finalizers:
    - system-protection
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "devices"
    verbs:
      - "get"
      - "list"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "user-preferences"
      - "annotationsettings"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: ai-operator-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "AI 记忆管理员"
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-ai-operator", "role-template-update-ai-memory", "role-template-execute-ai-memory", "role-template-export-ai-memory", "role-template-create-ai-memory", "role-template-import-ai-memory", "role-template-allocate-ai-memory", "role-template-clear-ai-memory", "role-template-settings-ai-memory", "role-template-prompts-ai-memory", "role-template-logs-ai-memory" ]'
  finalizers:
    - system-protection
rules: []
