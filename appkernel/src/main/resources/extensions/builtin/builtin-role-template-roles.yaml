apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: normal-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "普通用户"
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "authenticated" ]'
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["profile:manage","authentications:manage"]'
  finalizers:
    - system-protection
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "devices"
    verbs:
      - "get"
      - "list"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "user-preferences"
      - "annotationsettings"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "parameter-settings"
    resourceNames:
      - "site"
    verbs:
      - "get"
