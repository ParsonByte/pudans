apiVersion: pudans.tolim.cn/v1alpha1
kind: AuthProvider
metadata:
  name: local
  labels:
    pudans.tolim.cn/auth-binding: "false"
    pudans.tolim.cn/privileged: "true"
  finalizers:
    - system-protection
spec:
  displayName: Local
  description: Built-in local username and password authentication.
  authenticationUrl: /login
  method: post
  rememberMeSupport: true
  authType: form

---
apiVersion: pudans.tolim.cn/v1alpha1
kind: AuthProvider
metadata:
  name: feishu
  labels:
    pudans.tolim.cn/auth-binding: "false"
    pudans.tolim.cn/privileged: "true"
  finalizers:
    - system-protection
spec:
  displayName: Feishu
  description: Sign in with a Feishu account. Local users must be provisioned and bound first.
  authenticationUrl: /apis/api.pudans.tolim.cn/v1alpha1/oauth2/authorization/feishu
  method: get
  rememberMeSupport: false
  authType: oauth2
