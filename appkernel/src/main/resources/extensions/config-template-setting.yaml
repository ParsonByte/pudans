apiVersion: v1alpha1
kind: Setting
metadata:
  name: system
spec:
  forms:
    - group: basic
      label: Basic
      formSchema:
        - $formkit: text
          label: Title
          name: title
          validation: required
        - $formkit: text
          label: Subtitle
          name: subtitle
        - $formkit: text
          label: Logo
          name: logo
        - $formkit: text
          label: Favicon
          name: favicon
    - group: user
      label: Users
      formSchema:
        - $formkit: text
          label: Protected usernames
          name: protectedUsernames
        - $formkit: text
          label: Default role for imported users
          name: defaultRole
