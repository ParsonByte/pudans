apiVersion: pudans.tolim.cn/v1alpha1
kind: AiPlan
metadata:
  name: standard
  labels:
    pudans.tolim.cn/builtin: "true"
    pudans.tolim.cn/do-not-overwrite: "true"
spec:
  displayName: 标准套餐
  description: 默认套餐
  enabled: true
  quota:
    fiveHour:
      limit: 3000000
    weekly:
      limit: 20000000
      resetDayOfWeek: MONDAY
      resetHour: 0
  toleranceUnits: 5000
  vouchers:
    fiveHour: 2
    weekly: 1
    period: MONTHLY
  rateLimit:
    maxConcurrency: 4
    maxRpm: 0
  fallback:
    onFiveHourExhausted: DENY
  access:
    routeGroups: []
    models: []
    features: []