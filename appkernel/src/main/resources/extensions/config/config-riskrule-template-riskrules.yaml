apiVersion: pudans.tolim.cn/v1alpha1
kind: RiskRule
metadata:
  name: request-flood
  labels:
    pudans.tolim.cn/do-not-overwrite: "true"
    pudans.tolim.cn/builtin: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "请求洪泛"
    rbac.authorization.pudans.tolim.cn/description: "同一 IP 在时间窗口内请求次数超过阈值时触发。"
spec:
  scene: request-flood
  description: "同一 IP 在时间窗口内请求次数超过阈值时触发。"
  enabled: true
  windowSeconds: 60
  threshold: 300
  blockSeconds: 60
  metric: "IP"
  action: "BLOCK"
---
