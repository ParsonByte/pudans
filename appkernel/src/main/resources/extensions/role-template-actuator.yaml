apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-actuator
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Actuator"
    rbac.authorization.pudans.tolim.cn/display-name: "Actuator Manage"
rules:
  - nonResourceURLs: [ "/actuator/*" ]
    verbs: [ "get", "post", "delete" ]
