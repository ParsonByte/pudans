apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-audit-logs
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Audit Logs"
    rbac.authorization.pudans.tolim.cn/display-name: "Audit Log View"
rules:
  - apiGroups: [ "console.api.pudans.tolim.cn" ]
    resources:
      [
        "auditlogs",
        "auditlogs/graph",
        "auditlogs/trace",
        "auditlogs/replay",
      ]
    verbs: [ "get", "list" ]
