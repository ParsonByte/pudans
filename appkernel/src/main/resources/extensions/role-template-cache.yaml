apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-cache
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Cache"
    rbac.authorization.pudans.tolim.cn/display-name: "Cache Manage"
rules:
  - nonResourceURLs: [ "/actuator/caches" ]
    verbs: [ "get" ]
