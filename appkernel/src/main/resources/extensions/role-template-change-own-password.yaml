apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-change-own-password
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
rules:
  - apiGroups: [ "api.pudans.tolim.cn" ]
    resources: [ "users/password" ]
    resourceNames: [ "-" ]
    verbs: [ "update" ]
  - apiGroups: [ "api.pudans.tolim.cn" ]
    resources: [ "users/self" ]
    resourceNames: [ "-" ]
    verbs: [ "update" ]
