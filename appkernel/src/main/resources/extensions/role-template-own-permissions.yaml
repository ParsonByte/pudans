apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-own-permissions
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/permissions"
      - "users/ui-permissions"
    resourceNames:
      - "-"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/self"
    resourceNames:
      - "-"
    verbs:
      - "get"
