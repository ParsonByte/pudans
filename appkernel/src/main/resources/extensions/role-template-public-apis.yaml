apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-public-apis
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
rules:
  - apiGroups: [ "api.pudans.tolim.cn" ]
    resources: [ "passkeys/assertion/options", "passkeys/assertion/verify" ]
    verbs: [ "create" ]
  - nonResourceURLs:
      [
        "/actuator/globalinfo",
        "/actuator/health",
        "/actuator/health/*",
      ]
    verbs: [ "get", "post" ]
