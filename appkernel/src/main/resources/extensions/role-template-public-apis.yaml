apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-public-apis
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
rules:
  - apiGroups: [ "public.api.pudans.tolim.cn" ]
    resources: [ "passkeys/assertion/options", "passkeys/assertion/verify" ]
    verbs: [ "create" ]
  - nonResourceURLs:
      [
        "/actuator/globalinfo",
        "/actuator/health",
        "/actuator/health/*",
        "/login/public-key",
        "/apis/auth.api.pudans.tolim.cn/v1alpha1/oauth2/authorization/feishu",
        "/apis/auth.api.pudans.tolim.cn/v1alpha1/oauth2/callback/feishu",
      ]
    verbs: [ "get", "post" ]
