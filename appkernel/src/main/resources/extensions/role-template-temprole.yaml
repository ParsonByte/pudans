apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-temproles
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Just-In-Time Access"
    rbac.authorization.pudans.tolim.cn/display-name: "Temporary Role View"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "temprolebindings"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-apply-temproles
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-temproles" ]
    rbac.authorization.pudans.tolim.cn/module: "Just-In-Time Access"
    rbac.authorization.pudans.tolim.cn/display-name: "Temporary Role Apply"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "temprolebindings"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "temprolebindings/revoke"
    verbs:
      - "create"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-approve-temproles
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-temproles" ]
    rbac.authorization.pudans.tolim.cn/module: "Just-In-Time Access"
    rbac.authorization.pudans.tolim.cn/display-name: "Temporary Role Approve"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "temprolebindings/approve"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "temprolebindings/revoke"
    verbs:
      - "create"
