apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-users
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-users", "role-template-manage-usergroups" ]
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User Manage"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users"
      - "users/batch"
      - "users/local"
      - "users/usergroup"
    verbs:
      - "create"
      - "update"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/password"
    verbs:
      - "update"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/disable"
      - "users/enable"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/usergroup"
      - "users/permissions"
      - "users/connections"
      - "users/activity"
    verbs:
      - "get"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-users
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User View"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-usergroups
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-usergroups" ]
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User Group Manage"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "usergroups"
      - "usergroupbindings"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-usergroups
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User Group View"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "usergroups"
      - "usergroupbindings"
    verbs:
      - "get"
      - "list"
