apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-webhooks
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Webhook"
    rbac.authorization.pudans.tolim.cn/display-name: "Webhook View"
rules:
  - apiGroups: [ "api.pudans.tolim.cn" ]
    resources: [ "webhooks" ]
    verbs: [ "get", "list" ]
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-webhooks
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-webhooks" ]
    rbac.authorization.pudans.tolim.cn/module: "Webhook"
    rbac.authorization.pudans.tolim.cn/display-name: "Webhook Manage"
rules:
  - apiGroups: [ "api.pudans.tolim.cn" ]
    resources: [ "webhooks" ]
    verbs: [ "create", "update", "patch", "delete" ]
