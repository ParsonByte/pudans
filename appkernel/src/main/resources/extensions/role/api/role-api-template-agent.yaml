apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-agent-sessions
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Agent"
    rbac.authorization.pudans.tolim.cn/display-name: "Agent 会话查看"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "agentsessions"
      - "agentsessions/mine"
      - "agentsessions/summary"
      - "agentsessions/view"
      - "agentsessions/messages"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "agentruns"
      - "agentruns/status"
      - "agentruns/events"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-agent-sessions
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-agent-sessions" ]
    rbac.authorization.pudans.tolim.cn/module: "Agent"
    rbac.authorization.pudans.tolim.cn/display-name: "Agent 会话管理"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "agentsessions"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "agentsessions/-"
    verbs:
      - "create"
      - "patch"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "agentruns/start"
      - "agentruns/cancel"
      - "agentruns/approvals"
    verbs:
      - "create"
---
