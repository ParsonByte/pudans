apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-ai-admin
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "AI"
    rbac.authorization.pudans.tolim.cn/display-name: "AI 系统管理员"
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-ai-operator", "role-template-ai-plans", "role-template-view-ai-plans", "role-template-plans-view", "role-template-create-ai-plans", "role-template-update-ai-plans", "role-template-delete-ai-plans", "role-template-assign-ai-plans", "role-template-ratios-ai-plans", "role-template-grant-ai-plans" ]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memoryrecords"
    verbs:
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memoryrecords/restore"
      - "memoryrecords/rebuild"
      - "memoryrecords/flush"
      - "orgmemories/approve"
      - "orgmemories/reject"
      - "orgmemories/revoke"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memoryrecords/export"
      - "aiproviders"
      - "aiproviders/test"
      - "aiproviders/files"
      - "aiproviders/models"
      - "aiproviders/completions"
      - "aiproviders/tools"
      - "aiproviders/minimax"
      - "aiproviders/qianwen"
      - "aiproviders/actions"
      - "aiproviders/arrange"
      - "aiproviders/presets"
      - "aigenerations"
      - "aiprovideraccounts"
      - "aiprovideraccounts/test"
      - "aiprovideraccounts/quota"
      - "aiprovideraccounts/balance"
      - "aimodels"
      - "aimodels/test"
      - "airoutegroups"
      - "airoutegroups/actions"
      - "airoutegroups/arrange"
      - "aichatmodes"
      - "aisettings"
      - "aisettings/rebuild-embeddings"
      - "aiteams"
      - "aiteams/members"
      - "aiagents"
      - "aimemoryprompts"
      - "aimemoryprompts/resolve"
      - "aimemoryprompts/set"
      - "aimemoryprompts/settings"
      - "aimemoryprompts/log"
      - "aimemorypromptbindings"
      - "aimemoryassets"
      - "aimemoryassets/counts"
      - "aimemoryassets/layers"
      - "aimemoryassets/bindings"
      - "aimemoryassets/import"
      - "aimemoryassets/clear"
      - "aimemoryassets/generation-logs"
      - "aimemorygenerationlogs"
      - "knowledgebases"
      - "knowledgebases/documents"
      - "knowledgebases/reindex"
      - "knowledgebases/querylogs"
      - "aistats/routing"
      - "aistats/points"
      - "aistats/units"
      - "aistats/memory"
      - "aistats/kb"
      - "aistats/usage"
      - "aisandboxproviders"
      - "aigatewaysessions"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
      - "delete"
