apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-ai-gateway
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "AI"
    rbac.authorization.pudans.tolim.cn/display-name: "AI Agent 网关"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aigateway/openai"
      - "aigateway/anthropic"
      - "aigateway/gemini"
      - "memorybridge/atomic"
      - "memorybridge/conversation"
      - "memorybridge/scenario"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aigateway/status"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aigatewaysessions"
    verbs:
      - "get"
      - "list"
      - "create"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aisettings"
      - "aimodels"
      - "airoutegroups"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "personalaccesstokens"
      - "personalaccesstokens/actions"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aisettings"
    verbs:
      - "update"
      - "patch"
