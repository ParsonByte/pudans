apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-ai-generations
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "AI"
    rbac.authorization.pudans.tolim.cn/display-name: "AI 生成记录"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aigenerations"
    verbs:
      - "get"
      - "list"
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aigenerations/documents"
    verbs:
      - "create"
