apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-ai-operator
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "AI"
    rbac.authorization.pudans.tolim.cn/display-name: "AI 记忆管理员"
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [
        "role-template-ai-user",
        "role-template-view-ai-model-market",
        "role-template-view-ai-knowledge-bases",
        "role-template-view-ai-teams",
        "role-template-view-ai-memory",
        "role-template-view-ai-instructions",
        "role-template-view-ai-mcp-servers",
        "role-template-view-ai-skills",
        "role-template-view-ai-hooks",
        "role-template-view-ai-environment-variables",
        "role-template-view-ai-subagents",
        "role-template-view-ai-slash-commands"
      ]
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memoryrecords"
      - "memoryrecords/pipeline"
      - "memoryrequests"
      - "orgmemories"
      - "orgmemories/pending"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memoryrecords/freeze"
      - "memoryrequests/approve"
      - "memoryrequests/reject"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aimemoryassets"
      - "aimemoryassets/counts"
      - "aimemoryassets/layers"
      - "aimemoryassets/bindings"
      - "aimemoryassets/import"
      - "aimemoryassets/clear"
      - "aimemoryassets/generation-logs"
      - "aimemorygenerationlogs"
      - "aimemoryprompts/set"
      - "aimemoryprompts/settings"
      - "aimemoryprompts/log"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aisandboxproviders"
    verbs:
      - "get"
      - "list"
