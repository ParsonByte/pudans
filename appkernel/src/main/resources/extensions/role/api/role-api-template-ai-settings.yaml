apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-ai-settings
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "AI"
    rbac.authorization.pudans.tolim.cn/display-name: "AI 全局设置管理"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aisettings"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
