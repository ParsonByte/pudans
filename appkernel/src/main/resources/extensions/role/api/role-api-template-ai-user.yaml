apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-ai-user
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "AI"
    rbac.authorization.pudans.tolim.cn/display-name: "AI 普通用户"
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-usage-overview", "role-template-usage-overview-view", "role-template-usage-overview-use-voucher" ]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aigenerations"
      - "aigenerations/documents"
    verbs:
      - "get"
      - "list"
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "chats/completions"
      - "chats/modes"
      - "conversations"
      - "conversations/messages"
    verbs:
      - "get"
      - "list"
      - "create"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "conversations/branch"
      - "conversations/artifacts"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "chats/attachments"
    verbs:
      - "get"
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiteams"
      - "aiagents"
      - "aimodels"
      - "airoutegroups"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memories"
      - "memories/search"
      - "memories/scenes"
      - "memories/profile"
      - "memories/requests"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memories/correction-request"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aimemoryassets"
      - "aimemoryassets/counts"
      - "aimemoryassets/layers"
      - "aimemoryassets/generation-logs"
      - "aimemorygenerationlogs"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aimemoryassets"
      - "aimemoryassets/import"
      - "aimemoryassets/bindings"
      - "aimemoryassets/clear"
      - "aimemoryassets/layers"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aimemoryprompts/settings"
      - "aimemoryprompts/log"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "knowledgebases"
      - "knowledgebases/search"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "knowledgebases/documents"
    verbs:
      - "get"
      - "list"
      - "create"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aimcpservers"
      - "aimcpservers/by-agent"
      - "aiskills"
      - "aiskills/by-agent"
      - "aiinstructions"
      - "aiinstructions/by-agent"
      - "aihooks"
      - "aihooks/by-agent"
      - "aienvironmentvariables"
      - "aienvironmentvariables/by-agent"
      - "aisubagents"
      - "aisubagents/by-agent"
      - "aislashcommands"
      - "aislashcommands/by-agent"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aimcpservers/test"
      - "aiskills/import"
      - "aislashcommands/resolve"
      - "aienvironmentvariables/value"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "airuntimes"
      - "airuntimes/providers"
      - "airuntimes/files"
      - "airuntimes/logs"
    verbs:
      - "get"
      - "list"
      - "create"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "airuntimes/start"
      - "airuntimes/stop"
      - "airuntimes/restart"
      - "airuntimes/exec"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiagui/run"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiagentprotocol/runs"
      - "aiagentprotocol/threads"
    verbs:
      - "get"
      - "list"
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aia2a"
      - "aia2a/agent.json"
    verbs:
      - "get"
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aistats/usage"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiplan/usage"
      - "aiplan/vouchers"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiplan/vouchers"
    resourceNames:
      - "-/use"
    verbs:
      - "create"
