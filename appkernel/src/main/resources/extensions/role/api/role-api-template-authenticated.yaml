apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: authenticated
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [
        "role-template-own-user-info",
        "role-template-own-permissions",
        "role-template-change-own-password",
        "role-template-annotation-setting",
        "role-template-manage-own-pat",
        "role-template-manage-own-authentications",
        "role-template-own-passkeys",
        "role-template-own-connections"
      ]
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "authproviders"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "navigation"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "usernavigations"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "permission-catalog"
    verbs:
      - "get"
      - "list"
