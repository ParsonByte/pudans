      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-live-recordings
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-live-recordings" ]
    rbac.authorization.pudans.tolim.cn/module: "Live"
    rbac.authorization.pudans.tolim.cn/display-name: "Live Recording Manage"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "liverecordings/stop"
      - "liverecordings/download-url"
      - "liverecordings/retry"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "liverecordings"
    resourceNames:
      - "batch"
    verbs:
      - "delete"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-live-sources
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Live"
    rbac.authorization.pudans.tolim.cn/display-name: "Live Source View"
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-live-recordings" ]
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "livesources"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "livesources/health"
    verbs:
      - "get"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-live-sources
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Live"
    rbac.authorization.pudans.tolim.cn/display-name: "Live Source Manage"
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-live-sources", "role-template-manage-live-recordings" ]
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "livesources"
    verbs:
      - "update"
      - "delete"
  - nonResourceURLs:
      - "/apis/api.pudans.tolim.cn/v1alpha1/livesources/from-url"
      - "/apis/api.pudans.tolim.cn/v1alpha1/livesources/resolve"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "livesources/resolve"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "livesources/record"
    verbs:
      - "create"
---
