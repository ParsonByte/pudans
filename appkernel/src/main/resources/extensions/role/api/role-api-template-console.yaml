    rbac.authorization.pudans.tolim.cn/ui-action: "manage"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.live-recordings"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["liverecordings:manage"]'
