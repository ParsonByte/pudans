apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-live-recordings
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Live"
    rbac.authorization.pudans.tolim.cn/display-name: "Live Recording View"
rules:
