apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-all-ai-channels
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-ai-config" ]
    rbac.authorization.pudans.tolim.cn/module: "DANS AI"
    rbac.authorization.pudans.tolim.cn/display-name: "全平台 AI 渠道查看"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aichannels/all"
    verbs:
      - "get"
      - "list"
