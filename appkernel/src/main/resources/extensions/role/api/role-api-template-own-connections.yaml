apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-own-connections
  labels:
    pudans.tolim.cn/role-template: "true"
    pudans.tolim.cn/hidden: "true"
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "userconnections"
      - "userconnections/providers"
      - "userconnections/bind"
    verbs:
      - "create"
      - "get"
      - "list"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "*"
    resourceNames:
      - "oidc/authorize-url"
    verbs:
      - "get"
