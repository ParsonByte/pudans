    rbac.authorization.pudans.tolim.cn/ui-operation: "create"
    rbac.authorization.pudans.tolim.cn/ui-label: "新增环境变量"
    rbac.authorization.pudans.tolim.cn/ui-description: "创建 Agent 环境变量。"
