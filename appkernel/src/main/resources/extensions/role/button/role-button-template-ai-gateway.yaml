apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-create-ai-gateway
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-gateway" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.models.gateway"
    rbac.authorization.pudans.tolim.cn/ui-operation: "create"
    rbac.authorization.pudans.tolim.cn/ui-label: "生成网关密钥"
    rbac.authorization.pudans.tolim.cn/ui-description: "创建用于调用 AI 网关的个人访问令牌。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-gateway:create-key"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "personalaccesstokens"
    verbs:
      - "create"
---
