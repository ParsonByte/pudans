apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-create-ai-instructions
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-instructions" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.library.instructions"
    rbac.authorization.pudans.tolim.cn/ui-operation: "create"
    rbac.authorization.pudans.tolim.cn/ui-label: "新增指令"
    rbac.authorization.pudans.tolim.cn/ui-description: "创建共享指令或 Agent 指令。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-instructions:create"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiinstructions"
    verbs:
      - "create"
