apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-update-ai-memory
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-memory" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.library.memory"
    rbac.authorization.pudans.tolim.cn/ui-operation: "update"
    rbac.authorization.pudans.tolim.cn/ui-label: "审核记忆"
    rbac.authorization.pudans.tolim.cn/ui-description: "审批记忆请求与组织记忆。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-memory:update"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memoryrequests/approve"
      - "memoryrequests/reject"
      - "orgmemories/approve"
      - "orgmemories/reject"
      - "orgmemories/revoke"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "memories/correction-request"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aimemoryassets"
      - "aimemoryassets/layers"
    verbs:
      - "update"
      - "patch"
---
