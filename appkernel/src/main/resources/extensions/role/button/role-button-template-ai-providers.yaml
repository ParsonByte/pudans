apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-create-ai-providers
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-providers" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.models.providers"
    rbac.authorization.pudans.tolim.cn/ui-operation: "create"
    rbac.authorization.pudans.tolim.cn/ui-label: "新增供应商资源"
    rbac.authorization.pudans.tolim.cn/ui-description: "创建供应商、账号或模型。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-providers:create"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiproviders"
      - "aiprovideraccounts"
      - "aimodels"
      - "aiproviders/files"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiproviders/actions"
      - "aiproviders/arrange"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiproviders/models"
      - "aiproviders/minimax"
      - "aiproviders/qianwen"
    verbs:
      - "get"
---
