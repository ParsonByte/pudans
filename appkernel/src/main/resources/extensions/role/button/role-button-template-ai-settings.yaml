apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-update-ai-settings
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-settings" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.settings"
    rbac.authorization.pudans.tolim.cn/ui-operation: "update"
    rbac.authorization.pudans.tolim.cn/ui-label: "保存 AI 设置"
    rbac.authorization.pudans.tolim.cn/ui-description: "更新 AI 全局设置。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-settings:update"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aisettings"
    verbs:
      - "get"
      - "update"
      - "patch"
