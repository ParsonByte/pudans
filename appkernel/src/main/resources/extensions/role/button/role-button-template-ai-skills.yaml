apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-create-ai-skills
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-skills" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.library.skills"
    rbac.authorization.pudans.tolim.cn/ui-operation: "create"
    rbac.authorization.pudans.tolim.cn/ui-label: "新增技能"
    rbac.authorization.pudans.tolim.cn/ui-description: "创建内联技能或从 URL 导入 SKILL.md。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-skills:create"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiskills"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiskills/import"
    verbs:
      - "create"
---
