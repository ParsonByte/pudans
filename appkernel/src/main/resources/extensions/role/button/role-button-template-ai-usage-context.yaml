    rbac.authorization.pudans.tolim.cn/ui-description: "导出筛选范围内的上下文构成。"
    rbac.authorization.pudans.tolim.cn/ui-order: "20"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-usage-context:export"]'
rules:
