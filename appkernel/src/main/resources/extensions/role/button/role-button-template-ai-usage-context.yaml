apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-usage-context-view
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-usage-context" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.usage.context"
    rbac.authorization.pudans.tolim.cn/ui-operation: "view"
    rbac.authorization.pudans.tolim.cn/ui-label: "查看上下文构成"
    rbac.authorization.pudans.tolim.cn/ui-description: "查看 system、history、memory、kb 与用户输入占比。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-usage-context:view"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aistats/usage"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
