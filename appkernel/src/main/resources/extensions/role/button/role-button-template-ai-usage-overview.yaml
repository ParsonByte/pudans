apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-usage-overview-view
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-ai-usage-overview" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "ai.usage.overview"
    rbac.authorization.pudans.tolim.cn/ui-operation: "view"
    rbac.authorization.pudans.tolim.cn/ui-label: "查看用量概览"
    rbac.authorization.pudans.tolim.cn/ui-description: "查看总览、按天序列与排行。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-usage-overview:view"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aistats/usage"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
