apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-approve-creation-content
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-all-creation-content" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.creation-content"
    rbac.authorization.pudans.tolim.cn/ui-operation: "approve"
    rbac.authorization.pudans.tolim.cn/ui-label: "审核通过"
    rbac.authorization.pudans.tolim.cn/ui-description: "通过作品、模板或活动的发布审核。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["creation-content:approve"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "works/approve"
      - "templates/approve"
      - "activities/approve"
    verbs:
      - "create"
---
