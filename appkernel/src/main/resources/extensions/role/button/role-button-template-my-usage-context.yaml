apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-my-usage-context-view
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-my-usage-context" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "default.usage.context"
    rbac.authorization.pudans.tolim.cn/ui-operation: "view"
    rbac.authorization.pudans.tolim.cn/ui-label: "查看我的上下文构成"
    rbac.authorization.pudans.tolim.cn/ui-description: "查看本人 system、history、memory、kb 与用户输入占比。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["my-usage-context:view"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aistats/usage"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-my-usage-context-export
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-my-usage-context" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "default.usage.context"
    rbac.authorization.pudans.tolim.cn/ui-operation: "export"
    rbac.authorization.pudans.tolim.cn/ui-label: "导出我的上下文构成"
    rbac.authorization.pudans.tolim.cn/ui-description: "导出本人筛选范围内的上下文构成。"
    rbac.authorization.pudans.tolim.cn/ui-order: "20"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["my-usage-context:export"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
