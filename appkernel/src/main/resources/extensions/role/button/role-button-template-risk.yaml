apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-update-riskrules
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-riskrules" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.risk"
    rbac.authorization.pudans.tolim.cn/ui-operation: "update"
    rbac.authorization.pudans.tolim.cn/ui-label: "编辑风险规则"
    rbac.authorization.pudans.tolim.cn/ui-description: "调整风险规则的开关、阈值和处置动作。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["risk:update"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "riskrules"
    verbs:
      - "update"
      - "patch"
---
