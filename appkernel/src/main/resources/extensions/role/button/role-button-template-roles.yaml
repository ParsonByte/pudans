apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-create-roles
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-roles" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.roles"
    rbac.authorization.pudans.tolim.cn/ui-operation: "create"
    rbac.authorization.pudans.tolim.cn/ui-label: "创建角色"
    rbac.authorization.pudans.tolim.cn/ui-description: "创建新的自定义角色。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["roles:create"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "roles"
    verbs:
      - "create"
---
