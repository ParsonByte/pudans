apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-create-storage-files
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-storage-files" ]'
    rbac.authorization.pudans.tolim.cn/ui-type: "button"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.storage-files"
    rbac.authorization.pudans.tolim.cn/ui-operation: "create"
    rbac.authorization.pudans.tolim.cn/ui-label: "上传文件"
    rbac.authorization.pudans.tolim.cn/ui-description: "创建上传会话并上传存储文件。"
    rbac.authorization.pudans.tolim.cn/ui-order: "10"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["storage-files:create"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "storagefiles/upload"
    verbs:
      - "create"
---
