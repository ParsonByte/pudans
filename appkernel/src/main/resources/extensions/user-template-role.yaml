apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: super-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "超级管理员"
    rbac.authorization.pudans.tolim.cn/ui-permissions: |
      ["*"]
  finalizers:
    - system-protection
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    nonResourceURLs: ["*"]
    verbs: ["*"]

---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: system-admin-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "系统管理员"
  finalizers:
    - system-protection
rules:
  - apiGroups: ["api.pudans.tolim.cn"]
    resources:
      [
        "users",
        "users/batch",
        "users/password",
        "users/permissions",
        "users/usergroup",
      ]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["usergroups", "usergroupbindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources:
      [
        "roles",
        "rolebindings",
        "temprolebindings",
        "temprolebindings/approve",
        "temprolebindings/revoke",
      ]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources:
      [
        "auditlogs",
        "auditlogs/graph",
        "auditlogs/trace",
        "auditlogs/replay",
      ]
    verbs: ["get", "list"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["riskrules", "webhooks"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["authproviders"]
    verbs: ["get", "list"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["settings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: normal-role
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "普通用户"
  finalizers:
    - system-protection
rules:
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["users", "users/permissions"]
    resourceNames: ["-"]
    verbs: ["get", "list"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["users"]
    resourceNames: ["-"]
    verbs: ["update"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["users/password"]
    resourceNames: ["-"]
    verbs: ["update"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["users/self"]
    resourceNames: ["-"]
    verbs: ["get"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["users/self"]
    resourceNames: ["-"]
    verbs: ["update"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["authentications", "authentications/totp", "authentications/settings"]
    verbs: ["*"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["personalaccesstokens"]
    verbs: ["*"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["devices"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["user-preferences", "annotationsettings"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources:
      [
        "userconnections",
        "userconnections/oidc/providers",
        "userconnections/oidc/bind",
      ]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["passkeys", "passkeys/registration/options", "passkeys/registration/verify"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["api.pudans.tolim.cn"]
    resources: ["authproviders"]
    verbs: ["get", "list"]

---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: guest
  labels:
    pudans.tolim.cn/builtin: "true"
    rbac.authorization.pudans.tolim.cn/system-reserved: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/display-name: "访客"
    rbac.authorization.pudans.tolim.cn/disallow-access-console: "true"
    rbac.authorization.pudans.tolim.cn/redirect-on-login: "/uc"
  finalizers:
    - system-protection
rules: []