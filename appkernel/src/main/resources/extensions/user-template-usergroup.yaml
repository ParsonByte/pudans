  labels:
    pudans.tolim.cn/builtin: "true"
  finalizers:
    - system-protection
displayName: 超级管理员组
description: 内置超级管理员组，绑定 super-role。
roleRefs:
  - kind: Role
    name: super-role
    apiGroup: pudans.tolim.cn

