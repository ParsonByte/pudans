apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-ai-plans
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "AI Billing"
    rbac.authorization.pudans.tolim.cn/display-name: "AI Plans View"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["ai-plans:view"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiplans"
      - "aiplanbindings"
      - "users"
      - "usergroups"
      - "aisettings"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "aiplanbindings/resolve"
    verbs:
      - "get"