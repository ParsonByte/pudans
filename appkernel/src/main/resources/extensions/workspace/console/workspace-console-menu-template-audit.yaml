apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-audit-logs
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Audit Logs"
    rbac.authorization.pudans.tolim.cn/display-name: "Audit Log View"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "view"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.audit"
    rbac.authorization.pudans.tolim.cn/ui-component: "audit"
    rbac.authorization.pudans.tolim.cn/ui-workspace: "console"
    rbac.authorization.pudans.tolim.cn/ui-path: "/audit"
    rbac.authorization.pudans.tolim.cn/ui-label: "审计"
    rbac.authorization.pudans.tolim.cn/ui-description: "查看审计日志和操作记录。"
    rbac.authorization.pudans.tolim.cn/ui-icon: "lucide:scroll-text"
    rbac.authorization.pudans.tolim.cn/ui-group: "控制"
    rbac.authorization.pudans.tolim.cn/ui-order: "50"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["audit:view"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "auditlogs"
      - "auditlogs/traces"
      - "auditlogs/journeys"
      - "auditlogs/graph"
      - "auditlogs/trace"
      - "auditlogs/replay"
      - "auditlogs/archives"
      - "auditlogs/archive-stats"
    verbs:
      - "get"
      - "list"
