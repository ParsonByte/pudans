    rbac.authorization.pudans.tolim.cn/ui-parent: "身份控制"
    rbac.authorization.pudans.tolim.cn/ui-parent-icon: "lucide:user-cog"
    rbac.authorization.pudans.tolim.cn/ui-group: "身份与权限"
    rbac.authorization.pudans.tolim.cn/ui-group-key: "identity"
    rbac.authorization.pudans.tolim.cn/ui-order: "100"
