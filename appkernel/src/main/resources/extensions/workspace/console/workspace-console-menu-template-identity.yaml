metadata:
  name: role-template-view-users
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User View"
