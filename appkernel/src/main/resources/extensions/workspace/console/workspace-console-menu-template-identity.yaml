apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-users
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-users", "role-template-manage-usergroups" ]
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User Manage"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "manage"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.users"
    rbac.authorization.pudans.tolim.cn/ui-capability: "manage-users"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["users:manage"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users"
      - "users/batch"
      - "users/local"
      - "users/usergroup"
    verbs:
      - "create"
      - "update"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/password"
    verbs:
      - "update"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/disable"
      - "users/enable"
    verbs:
      - "create"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "users/usergroup"
      - "users/permissions"
      - "users/connections"
      - "users/activity"
    verbs:
      - "get"
---
