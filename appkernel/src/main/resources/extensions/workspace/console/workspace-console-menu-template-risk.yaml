apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-riskrules
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Risk Control"
    rbac.authorization.pudans.tolim.cn/display-name: "Risk Rule View"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "view"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.risk"
    rbac.authorization.pudans.tolim.cn/ui-component: "risk"
    rbac.authorization.pudans.tolim.cn/ui-workspace: "console"
    rbac.authorization.pudans.tolim.cn/ui-path: "/console/risk"
    rbac.authorization.pudans.tolim.cn/ui-label: "风险"
    rbac.authorization.pudans.tolim.cn/ui-description: "管理风险规则和风险策略。"
    rbac.authorization.pudans.tolim.cn/ui-icon: "lucide:shield-alert"
    rbac.authorization.pudans.tolim.cn/ui-group: "控制"
    rbac.authorization.pudans.tolim.cn/ui-order: "40"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["risk:view"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "riskrules"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-riskrules
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-riskrules" ]
    rbac.authorization.pudans.tolim.cn/module: "Risk Control"
    rbac.authorization.pudans.tolim.cn/display-name: "Risk Rule Manage"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "manage"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.risk"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["risk:manage"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "riskrules"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
