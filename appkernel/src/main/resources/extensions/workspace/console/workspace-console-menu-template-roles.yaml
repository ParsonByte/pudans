apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-roles
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-roles", "role-template-audit-logs" ]
    rbac.authorization.pudans.tolim.cn/module: "Roles Management"
    rbac.authorization.pudans.tolim.cn/display-name: "Role Manage"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "manage"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.roles"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["roles:manage"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "roles"
      - "rolebindings"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
