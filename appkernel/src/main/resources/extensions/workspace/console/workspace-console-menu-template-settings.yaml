apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-settings
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Settings Management"
    rbac.authorization.pudans.tolim.cn/display-name: "Setting View"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "view"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.settings"
    rbac.authorization.pudans.tolim.cn/ui-component: "settings"
    rbac.authorization.pudans.tolim.cn/ui-workspace: "console"
    rbac.authorization.pudans.tolim.cn/ui-path: "/console/settings"
    rbac.authorization.pudans.tolim.cn/ui-label: "参数配置"
    rbac.authorization.pudans.tolim.cn/ui-description: "管理会话、认证、邮件、站点和审计参数。"
    rbac.authorization.pudans.tolim.cn/ui-icon: "lucide:settings-2"
    rbac.authorization.pudans.tolim.cn/ui-group: "通用"
    rbac.authorization.pudans.tolim.cn/ui-order: "20"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["settings:view"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "settings"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "configmaps"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "parameter-settings"
    verbs:
      - "get"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "systemconfigs"
    verbs:
      - "get"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "authproviders"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "auth-providers"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-settings
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: '[ "role-template-view-settings" ]'
    rbac.authorization.pudans.tolim.cn/module: "Settings Management"
    rbac.authorization.pudans.tolim.cn/display-name: "Setting Manage"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "manage"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.settings"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["settings:manage"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "settings"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "configmaps"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "parameter-settings"
      - "parameter-settings/-"
    verbs:
      - "get"
      - "list"
      - "create"
      - "update"
      - "patch"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "systemconfigs"
    verbs:
      - "get"
      - "list"
      - "update"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "authproviders"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "auth-providers"
      - "auth-providers/enable"
      - "auth-providers/disable"
    verbs:
      - "get"
      - "list"
      - "update"
