apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-view-usergroups
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User Group View"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "view"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.user-groups"
    rbac.authorization.pudans.tolim.cn/ui-component: "user-groups"
    rbac.authorization.pudans.tolim.cn/ui-workspace: "console"
    rbac.authorization.pudans.tolim.cn/ui-path: "/user-groups"
    rbac.authorization.pudans.tolim.cn/ui-label: "用户组"
    rbac.authorization.pudans.tolim.cn/ui-description: "维护用户组及其绑定的角色。"
    rbac.authorization.pudans.tolim.cn/ui-icon: "lucide:users-round"
    rbac.authorization.pudans.tolim.cn/ui-parent: "身份控制"
    rbac.authorization.pudans.tolim.cn/ui-parent-icon: "lucide:user-cog"
    rbac.authorization.pudans.tolim.cn/ui-group: "控制"
    rbac.authorization.pudans.tolim.cn/ui-order: "30"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["user-groups:view"]'
