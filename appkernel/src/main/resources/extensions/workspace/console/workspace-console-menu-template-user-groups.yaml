      - "api.pudans.tolim.cn"
    resources:
      - "usergroups"
      - "usergroupbindings"
    verbs:
      - "get"
      - "list"
---
apiVersion: pudans.tolim.cn/v1alpha1
kind: Role
metadata:
  name: role-template-manage-usergroups
  labels:
    pudans.tolim.cn/role-template: "true"
  annotations:
    rbac.authorization.pudans.tolim.cn/dependencies: |
      [ "role-template-view-usergroups" ]
    rbac.authorization.pudans.tolim.cn/module: "Users Management"
    rbac.authorization.pudans.tolim.cn/display-name: "User Group Manage"
    rbac.authorization.pudans.tolim.cn/ui-type: "menu"
    rbac.authorization.pudans.tolim.cn/ui-action: "manage"
    rbac.authorization.pudans.tolim.cn/ui-menu: "console.user-groups"
    rbac.authorization.pudans.tolim.cn/ui-permissions: '["user-groups:manage"]'
rules:
  - apiGroups:
      - "api.pudans.tolim.cn"
    resources:
      - "usergroups"
      - "usergroupbindings"
    verbs:
      - "create"
      - "update"
      - "patch"
      - "delete"
