name: pudans-notification

x-pudans-service: &pudans-service
  restart: unless-stopped
  env_file:
    - ../.env
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  networks:
    - pudans

services:
  notification:
    <<: *pudans-service
    image: ${PUDANS_REGISTRY:-pudans}/notification:${PUDANS_TAG:-local}
    build:
      context: ../../..
      dockerfile: deploy/assets/Dockerfile
      args:
        SERVICE: notification
    container_name: pudans-notification
    environment:
      PUDANS_ENVIRONMENT: ${PUDANS_ENVIRONMENT:-production}
      PUDANS_NACOS_ADDR: ${PUDANS_NACOS_ADDR:-nacos:8848}
      PUDANS_MANAGEMENT_ADDRESS: 0.0.0.0
      PUDANS_MANAGEMENT_PORT: "9092"
      PUDANS_INTERNAL_TOKEN: ${PUDANS_INTERNAL_TOKEN:?set PUDANS_INTERNAL_TOKEN}
      PUDANS_DB_URL: jdbc:postgresql://${PUDANS_DB_HOST:-postgresql}:${PUDANS_DB_PORT:-5432}/pudans_notification
      PUDANS_DB_USER: ${PUDANS_DB_USER:?set PUDANS_DB_USER}
      PUDANS_DB_PASSWORD: ${PUDANS_DB_PASSWORD:?set PUDANS_DB_PASSWORD}
      PUDANS_SENTINEL_DASHBOARD: ${PUDANS_SENTINEL_DASHBOARD:-sentinel:8858}
      PUDANS_MAIL_HOST: ${PUDANS_MAIL_HOST:-}
      PUDANS_MAIL_PORT: ${PUDANS_MAIL_PORT:-25}
      PUDANS_MAIL_USERNAME: ${PUDANS_MAIL_USERNAME:-}
      PUDANS_MAIL_PASSWORD: ${PUDANS_MAIL_PASSWORD:-}
      PUDANS_MAIL_FROM: ${PUDANS_MAIL_FROM:-no-reply@pudans.local}
      PUDANS_MAIL_SMTP_AUTH: ${PUDANS_MAIL_SMTP_AUTH:-false}
      PUDANS_MAIL_STARTTLS_ENABLED: ${PUDANS_MAIL_STARTTLS_ENABLED:-false}
      PUDANS_MAIL_SSL_ENABLED: ${PUDANS_MAIL_SSL_ENABLED:-false}
      PUDANS_NOTIFICATION_MAIL_ENABLED: ${PUDANS_NOTIFICATION_MAIL_ENABLED:-false}
      PUDANS_NOTIFICATION_SMS_ENABLED: ${PUDANS_NOTIFICATION_SMS_ENABLED:-false}
      PUDANS_NOTIFICATION_SMS_PROVIDER: ${PUDANS_NOTIFICATION_SMS_PROVIDER:-}
      PUDANS_LOG_FILE: /var/log/pudans/pudans-notification.json
      PUDANS_LOG_STRUCTURED: ${PUDANS_LOG_STRUCTURED:-true}
      PUDANS_OTLP_TRACING_ENDPOINT: ${PUDANS_OTLP_TRACING_ENDPOINT:-http://jaeger:4318/v1/traces}
      PUDANS_TRACING_EXPORT_ENABLED: ${PUDANS_TRACING_EXPORT_ENABLED:-true}
      PUDANS_TRACING_SAMPLING: ${PUDANS_TRACING_SAMPLING:-0.1}
      JAVA_OPTS: "${PUDANS_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC}"
    ports:
      - "${PUDANS_MANAGEMENT_BIND:-127.0.0.1}:9092:9092"
    volumes:
      - notification-logs:/var/log/pudans

networks:
  pudans:
    external: true
    name: ${PUDANS_DOCKER_NETWORK:-1panel-network}

volumes:
  notification-logs: