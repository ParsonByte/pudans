[versions]
lucene = '10.5.2'
resilience4j = '2.4.0'
therapi = '0.15.0'
commons-lang3 = '3.21.0'
tika = '4.1.0'
base62 = '0.1.3'
pf4j = '3.16.0'
webauthn4j = '0.29.1.RELEASE'
guava = '33.7.2-jre'
java-diff-utils = '4.17'
jsoup = '1.23.2'
json-patch = '1.13'
springdoc = '3.2.0'
openapi-schema-validator = '1.0.7'
bouncycastle = '1.86'
twofactor = '1.3'
thumbnailator = '0.4.21'
ua-parser = '1.6.1'
jsonassert = '2.0-rc1'
larksuite-oapi = '2.8.7'

[libraries]
lucene-core = { module = 'org.apache.lucene:lucene-core', version.ref = 'lucene' }
lucene-queryparser = { module = 'org.apache.lucene:lucene-queryparser', version.ref = 'lucene' }
lucene-highlighter = { module = 'org.apache.lucene:lucene-highlighter', version.ref = 'lucene' }
lucene-backward-codecs = { module = 'org.apache.lucene:lucene-backward-codecs', version.ref = 'lucene' }
lucene-analyzers-common = { module = 'org.apache.lucene:lucene-analysis-common', version.ref = 'lucene' }

therapi-runtime-javadoc = { module = 'com.github.therapi:therapi-runtime-javadoc', version.ref = 'therapi' }
therapi-runtime-javadoc-scribe = { module = 'com.github.therapi:therapi-runtime-javadoc-scribe', version.ref = 'therapi' }

resilience4j-springboot3 = { module = 'io.github.resilience4j:resilience4j-spring-boot4', version.ref = 'resilience4j' }
resilience4j-reactor = { module = 'io.github.resilience4j:resilience4j-reactor', version.ref = 'resilience4j' }

spring-boot-starter-data-redis-reactive = { module = 'org.springframework.boot:spring-boot-starter-data-redis-reactive' }
spring-session-data-redis = { module = 'org.springframework.session:spring-session-data-redis' }
commons-pool2 = { module = 'org.apache.commons:commons-pool2' }

apache-commons-lang3 = { module = 'org.apache.commons:commons-lang3', version.ref = 'commons-lang3' }
apache-tika-core = { module = 'org.apache.tika:tika-core', version.ref = 'tika' }

encoding-base62 = { module = 'io.seruco.encoding:base62', version.ref = 'base62' }
pf4j = { module = 'org.pf4j:pf4j', version.ref = 'pf4j' }
webauthn4j = { module = 'com.webauthn4j:webauthn4j-core', version.ref = 'webauthn4j' }
guava = { module = 'com.google.guava:guava', version.ref = 'guava' }
java-diff-utils = { module = 'io.github.java-diff-utils:java-diff-utils', version.ref = 'java-diff-utils' }
jsoup = { module = 'org.jsoup:jsoup', version.ref = 'jsoup' }
json-patch = { module = 'com.github.java-json-tools:json-patch', version.ref = 'json-patch' }
springdoc-openapi = { module = 'org.springdoc:springdoc-openapi-starter-webflux-ui', version.ref = 'springdoc' }
openapi-schema-validator = { module = 'org.openapi4j:openapi-schema-validator', version.ref = 'openapi-schema-validator' }
bouncycastle-bcpkix = { module = 'org.bouncycastle:bcpkix-jdk18on', version.ref = 'bouncycastle' }
twofactor-auth = { module = 'com.j256.two-factor-auth:two-factor-auth', version.ref = 'twofactor' }
thumbnailator = { module = 'net.coobird:thumbnailator', version.ref = 'thumbnailator' }
ua-parser = { module = 'com.github.ua-parser:uap-java', version.ref = 'ua-parser' }
jsonassert = { module = 'org.skyscreamer:jsonassert', version.ref = 'jsonassert' }
larksuite-oapi = { module = 'com.larksuite.oapi:oapi-sdk', version.ref = 'larksuite-oapi' }

[bundles]
lucene = ['lucene-core', 'lucene-queryparser', 'lucene-highlighter', 'lucene-backward-codecs', 'lucene-analyzers-common']
resilience4j = ['resilience4j-springboot3', 'resilience4j-reactor']
apache = ['apache-commons-lang3', 'apache-tika-core']
therapi = ['therapi-runtime-javadoc', 'therapi-runtime-javadoc-scribe']

[plugins]
spring-boot = 'org.springframework.boot:4.2.0-RC2'
spring-dependency-management = 'io.spring.dependency-management:1.1.7'
git-properties = 'com.gorylenko.gradle-git-properties:4.0.1'
undercouch-download = 'de.undercouch.download:5.7.0'
lombok = 'io.freefair.lombok:9.8.0'
checksum = 'org.gradle.crypto.checksum:1.4.0'
node = 'com.github.node-gradle.node:7.1.0'
openapi-generator = 'org.openapi.generator:7.12.0'
springdoc-openapi = 'org.springdoc.openapi-gradle-plugin:1.9.0'
versions = 'io.github.ben-manes.versions:0.66.0'
spotless = 'com.diffplug.spotless:8.10.2'
vanniktech-maven-publish = 'com.vanniktech.maven.publish:0.37.0'
