import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-platform'
    alias(libs.plugins.spring.boot) apply false
}

group = 'cn.tolim.pudans.platform'
description = 'Platform of the pudans appkernel (dependency constraints only).'

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform(SpringBootPlugin.BOM_COORDINATES)
    api platform(libs.langchain4j.bom)

    constraints {
        api libs.bundles.apache
        api libs.bundles.therapi
        api libs.springdoc.openapi
        api libs.openapi.schema.validator
        api libs.webauthn4j
        api libs.guava
        api libs.json.patch
        api libs.langchain4j.mcp
        api libs.langchain4j.community.dashscope
        // DashScope 模块传递引入 SDK，平台约束固定该 SDK 的版本。
        api libs.dashscope.sdk.java
        api libs.okhttp
        api libs.bundles.resilience4j
        api libs.twofactor.auth
        api libs.ua.parser
        api libs.aws.sdk.s3
        api libs.aws.sdk.netty.nio.client
        api libs.aliyun.oss
        api libs.tencent.cos
        api libs.qiniu.java.sdk
        api libs.upyun.java.sdk
        api libs.huawei.obs
    }
}
