import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-platform'
    alias(libs.plugins.spring.boot) apply false
}

group = 'cn.tolim.pudans.platform'
description = 'Platform of the pudans appkernel (dependency constraints only).'

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform(SpringBootPlugin.BOM_COORDINATES)

    constraints {
        api libs.bundles.apache
        api libs.bundles.therapi
        api libs.springdoc.openapi
        api libs.openapi.schema.validator
        api libs.webauthn4j
        api libs.guava
        api libs.json.patch
        api libs.agentscope.core
        api libs.agentscope.harness
        api libs.agentscope.extensions.model.anthropic
        api libs.agentscope.extensions.model.dashscope
        api libs.agentscope.extensions.model.openai
        api libs.agentscope.extensions.rag.simple
        api libs.agentscope.extensions.reme
        api libs.agentscope.extensions.sandbox.agentrun
        api libs.agentscope.extensions.sandbox.e2b
        // DashScope 扩展传递引入 SDK，平台约束固定原生媒体适配使用的版本。
        api libs.dashscope.sdk.java
        api libs.okhttp
        api libs.bundles.resilience4j
        api libs.twofactor.auth
        api libs.ua.parser
        api libs.aws.sdk.s3
        api libs.aws.sdk.netty.nio.client
        api libs.aliyun.oss
        api libs.tencent.cos
        api libs.qiniu.java.sdk
        api libs.upyun.java.sdk
        api libs.huawei.obs
    }
}
