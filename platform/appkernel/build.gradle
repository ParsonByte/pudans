import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-platform'
    alias(libs.plugins.spring.boot) apply false
}

group = 'cn.tolim.pudans.platform'
description = 'Platform of the pudans appkernel (dependency constraints only).'

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform(SpringBootPlugin.BOM_COORDINATES)

    constraints {
        api libs.bundles.apache
        api libs.bundles.therapi
        api libs.springdoc.openapi
        api libs.openapi.schema.validator
        api libs.webauthn4j
        api libs.guava
        api libs.json.patch
        api libs.bundles.resilience4j
        api libs.twofactor.auth
        api libs.ua.parser
    }
}
