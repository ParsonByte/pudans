global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: pudans-gateway
    metrics_path: /apis/pudans.tolim.cn/v1alpha1/actuator/prometheus
    static_configs:
      - targets:
          - pudans-host:9080
        labels:
          application: pudans-gateway

  - job_name: pudans-iam
    metrics_path: /apis/pudans.tolim.cn/v1alpha1/iam/actuator/prometheus
    static_configs:
      - targets:
          - pudans-host:9081
        labels:
          application: pudans-iam

  - job_name: pudans-repository
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pudans-host:9091
        labels:
          application: pudans-repository

  - job_name: pudans-notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pudans-host:9092
        labels:
          application: pudans-notification

  - job_name: pudans-mq
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pudans-host:9093
        labels:
          application: pudans-mq

  - job_name: pudans-job
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pudans-host:9094
        labels:
          application: pudans-job

  - job_name: pudans-search
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - pudans-host:9095
        labels:
          application: pudans-search