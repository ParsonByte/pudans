groups:
  - name: pudans-availability
    rules:
      - alert: PudansServiceDown
        expr: up{job=~"pudans-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: pudans service {{ $labels.job }} is down
          description: Prometheus has failed to scrape {{ $labels.job }} at {{ $labels.instance }} for more than 2 minutes.

      - alert: PudansHigh5xxRate
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: pudans application {{ $labels.application }} has a high 5xx rate
          description: 5xx responses exceed 0.05 per second for {{ $labels.application }} over 5 minutes.

      - alert: PudansHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: pudans application {{ $labels.application }} p95 latency is high
          description: p95 latency exceeds 0.5 seconds for {{ $labels.application }} over 5 minutes.