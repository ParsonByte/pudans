plugins {
    id 'java-platform'
}

group = 'cn.tolim.pudans.platform'
description = 'BOM for pudans plugins. Plugins compileOnly-depend on the appkernel contract jar.'

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform(project(':platform:appkernel'))
    constraints {

        api project(path: ':appkernel', configuration: 'contract')
    }
}
