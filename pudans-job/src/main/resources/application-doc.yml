spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false
  datasource:
    url: jdbc:postgresql://127.0.0.1:1/pudans_doc
    username: pudans
    password: pudans
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      "[hibernate.boot.allow_jdbc_metadata_access]": false
  liquibase:
    enabled: false
  sql:
    init:
      mode: never

springdoc:
  cache:
    disabled: true
  api-docs:
    enabled: true
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false
  show-actuator: false

management:
  health:
    defaults:
      enabled: false

pudans:
  internal:
    token: pudans-doc-internal-token
  api-docs:
    group: apis_job.v1alpha1
  job:
    executor:
      enabled: false
      auto-start: false