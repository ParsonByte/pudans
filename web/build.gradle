plugins {
    id 'base'
}

description = 'pudans auth-only frontend build and Spring Boot resource mount.'

def frontendDist = layout.projectDirectory.dir('../build/dist')

tasks.register('pnpmInstall', Exec) {
    group = 'frontend'
    description = 'Installs pnpm workspace dependencies.'
    workingDir layout.projectDirectory
    commandLine 'bash', '-lc', 'npx --yes pnpm@latest install'
    inputs.files(
        layout.projectDirectory.file('package.json'),
        layout.projectDirectory.file('pnpm-lock.yaml'),
        layout.projectDirectory.file('pnpm-workspace.yaml')
    )
    outputs.dir(layout.projectDirectory.dir('node_modules'))
}

tasks.register('pnpmBuild', Exec) {
    group = 'frontend'
    description = 'Builds the single web entry into the repository build/dist.'
    dependsOn tasks.named('pnpmInstall')
    workingDir layout.projectDirectory
    commandLine 'bash', '-lc', 'npx --yes pnpm@latest run build'
    inputs.files(fileTree(layout.projectDirectory) {
        include 'packages/**', 'public/**', 'src/**', 'index.html', '*.json', '*.yaml', '*.ts'
        exclude '**/node_modules/**', '**/dist/**', 'build/**'
    })
    outputs.dir(frontendDist)
}

tasks.register('bundleFrontend') {
    group = 'frontend'
    description = 'Compatibility alias for the single-entry web build.'
    dependsOn tasks.named('pnpmBuild')
}

tasks.named('assemble') {
    dependsOn tasks.named('pnpmBuild')
}

tasks.register('cleanFrontend', Delete) {
    group = 'frontend'
    delete frontendDist
}

tasks.named('clean') {
    dependsOn tasks.named('cleanFrontend')
}
