import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'base'
    alias(libs.plugins.node)
}

description = 'Pudans web frontend build.'

node {
    download = false
}

def webInputs = fileTree(layout.projectDirectory) {
    include 'next.config.ts', 'package.json', 'package-lock.json',
        'tsconfig*.json', 'postcss.config.mjs', 'eslint.config.js',
        '.prettierrc.json', '.prettierignore', 'knip.json', 'components.json',
        'src/**', 'tests/**', 'public/**', 'packages/**', 'scripts/**'
    exclude '**/node_modules/**', '**/dist/**', '**/build/**', '**/.next/**'
}

tasks.named('npmInstall') {
    inputs.file(layout.projectDirectory.file('package.json'))
    inputs.file(layout.projectDirectory.file('package-lock.json'))
    outputs.dir(layout.projectDirectory.dir('node_modules'))
}

tasks.register('buildWeb', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.files(webInputs)
    outputs.dir(layout.projectDirectory.dir('.next'))
}

tasks.register('standaloneWeb', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build:standalone']
    inputs.files(webInputs)
    outputs.dir(layout.projectDirectory.dir('.next/standalone'))
}

tasks.register('lint', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'lint']
}

tasks.register('typecheck', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'typecheck']
}

tasks.register('formatCheck', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'format:check']
}

tasks.register('testWeb', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'test']
}

tasks.register('stageDistribution', Sync) {
    description = 'Copy the standalone web server into the root build directory.'
    dependsOn tasks.named('standaloneWeb')
    from(layout.projectDirectory.dir('.next/standalone'))
    into(rootProject.layout.buildDirectory.dir('web'))
}

tasks.named('assemble') {
    dependsOn tasks.named('standaloneWeb'), tasks.named('stageDistribution')
}

tasks.named('check') {
    dependsOn tasks.named('lint'), tasks.named('typecheck'), tasks.named('formatCheck'), tasks.named('testWeb')
}

tasks.named('clean') {
    delete layout.projectDirectory.dir('.next')
}